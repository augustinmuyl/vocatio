services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vocatio-backend-dev
    env_file:
      - backend/.env
    command: bash -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic.ini:/app/alembic.ini:ro
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: vocatio-frontend-dev
    working_dir: /app
    env_file:
      - frontend/.env
    environment:
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
      - CHOKIDAR_USEPOLLING=1
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
